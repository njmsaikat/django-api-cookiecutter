server {
    listen {{ cookiecutter.port }};

    location / {
        # Pass request to backend
        proxy_pass http://backend:{{ cookiecutter.port }};

        # Timeouts matching Gunicorn's behavior
        proxy_connect_timeout 3s;     # Quick backend connect fail
        proxy_send_timeout 30s;       # Time allowed to send request to backend
        proxy_read_timeout 60s;       # Give buffer to Gunicorn's 60s timeout
        send_timeout 60s;             # Give slow clients more time to receive

        # Header passthrough
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Improve connection handling
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Buffer tuning (for moderate payloads)
        proxy_buffers 8 8k;
        proxy_buffer_size 16k;
    }
}
