services:
  db:
    image: postgres:16
    restart: "no"
    container_name: db_{{ cookiecutter.project_slug }}_dev
    env_file:
      - ./.env/dev.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - main
{% if cookiecutter.__redis == "y" %}
  redis:
    image: redis:7.4-alpine
    restart: "no"
    container_name: redis_{{ cookiecutter.project_slug }}_dev
    env_file:
      - ./.env/dev.env
    command: sh -c "redis-server --save 20 1 --loglevel warning --requirepass $${REDIS_PWD}"
    networks:
      - main
{% endif %}
  backend:
    restart: "no"
    container_name: backend_{{ cookiecutter.project_slug }}_dev
    build:
      context: .
      dockerfile: ./docker/dev/Dockerfile
    command: >
      sh -c "cd /app/backend &&
      python manage.py wait_for_db &&
      python manage.py runserver 0.0.0.0:{{ cookiecutter.port }}"
    volumes:
      - .:/app
      - log:/app/backend/media/log
    depends_on:
      db:
        condition: service_healthy
{% if cookiecutter.__redis == "y" %}      redis:
        condition: service_started
{% endif %}    env_file:
      - ./.env/base.env
      - ./.env/dev.env
{% if cookiecutter.use_nginx != "y" %}    ports:
      - {{ cookiecutter.port }}:{{ cookiecutter.port }}
{% endif %}    networks:
      - main
{% if cookiecutter.use_celery == "y" %}
  celery:
    restart: "no"
    container_name: celery_{{ cookiecutter.project_slug }}_dev
    build:
      context: .
      dockerfile: ./docker/dev/Dockerfile
    command: >
      sh -c "cd /app/backend &&
      celery --app=config.celery worker --pool=solo --loglevel=info"
    volumes:
      - .:/app
      - log:/app/backend/media/log
      - ./scripts/postgres-backup.sh:/backup.sh
      - ./backups/db:/var/www/backups/production-db
    env_file:
      - ./.env/base.env
      - ./.env/dev.env
    depends_on:
      - backend
      - redis
    networks:
      - main

  celery-beat:
    restart: "no"
    container_name: celery_beat_{{ cookiecutter.project_slug }}_dev
    build:
      context: .
      dockerfile: ./docker/dev/Dockerfile
    command: >
      sh -c "cd /app/backend &&
      rm -f celerybeat-schedule &&
      celery --app=config.celery beat --loglevel=info --pidfile="
    volumes:
      - .:/app
      - log:/app/backend/media/log
    env_file:
      - ./.env/base.env
      - ./.env/dev.env
    depends_on:
      - backend
      - celery
    networks:
      - main
{% endif %}{% if cookiecutter.use_nginx == "y" %}
  nginx:
    restart: "no"
    image: nginx:1.28
    container_name: nginx_{{ cookiecutter.project_slug }}_dev
    volumes:
      - ./conf.d:/etc/nginx/conf.d
    depends_on:
      - backend
    ports:
      - {{ cookiecutter.port }}:{{ cookiecutter.port }}
    networks:
      - main
{% endif %}
networks:
  main:

volumes:
  log:
  pgdata:
